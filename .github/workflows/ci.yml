# One job, five runs: the tests on PHP 8.5, on the PHP 8.6 pre-release and on the lowest dependency versions
# composer.json allows, static analysis and code style.
# composer.lock is committed: every run installs from it, except the lowest one, which resolves the dependencies
# anew with --prefer-lowest. composer.json and composer.lock are validated once, in the static analysis run.
# PHP 8.6 is not released yet: its run may fail without failing the workflow (continue-on-error). Static analysis
# and code style stay on 8.5. Actions are pinned to commit SHAs and the image to a digest, so that a run of the same
# commit uses the same tools; the comment names the version.
name: CI

on:
  push:
    branches: [main, master, '2.x']
  pull_request:
    branches: [main, master, '2.x']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container: shivammathur/node:24.04@sha256:ee402d3448af7d680cc697f0cd76f62b04598a527044e38dc4cf1c3404b13071
    continue-on-error: ${{ matrix.php == '8.6' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'PHP 8.5', php: '8.5', task: test }
          - { name: 'PHP 8.6', php: '8.6', task: test }
          - { name: 'PHP 8.5, lowest dependencies', php: '8.5', task: test, lowest: true }
          - { name: 'Static Analysis', php: '8.5', task: analyse }
          - { name: 'Code Style', php: '8.5', task: cs }

    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Validate composer.json and composer.lock
        if: matrix.task == 'analyse'
        run: composer validate --strict

      - name: Install dependencies
        if: ${{ !matrix.lowest }}
        run: composer install --prefer-dist --no-progress

      - name: Install the lowest allowed dependencies
        if: ${{ matrix.lowest }}
        run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-progress

      - name: Run tests
        if: matrix.task == 'test'
        run: composer test

      - name: Run PHPStan
        if: matrix.task == 'analyse'
        run: composer analyse

      - name: Check code style
        if: matrix.task == 'cs'
        run: composer cs
